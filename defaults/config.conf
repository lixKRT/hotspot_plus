# hotspot_plus 配置 (/data/adb/hotspot_plus/config.conf)
# 建议通过 WebUI 或 `hsp set KEY=VALUE` 修改（带校验）；手工修改后执行 `hsp apply`。

# 固定热点网关：1=向 TetheringManager 请求固定地址。
# 要与自建 DHCP/静态租约一起使用时，建议 FIXED_GATEWAY=1、DHCP_ENABLE=1。
FIXED_GATEWAY="1"
GATEWAY="192.168.42.1"
PREFIX="24"

# 自建 DHCP (busybox udhcpd)：静态租约依赖它；开启后系统 DhcpServer 的应答会被 iptables 拦截。
DHCP_ENABLE="1"
DHCP_START="192.168.42.100"
DHCP_END="192.168.42.200"
# 租期（秒）
LEASE_TIME="43200"
# 系统静态网关请求必须带一个占位客户端地址；冷启动时系统可能先把它发给设备。
# 保留 .254 作为占位，并把自动接管后的纠错交给 hspd；切到 .2 会与部分手机
# 的默认网关冲突而破坏 DHCP，不要随意改这个值。
# 下发给客户端的 DNS，留空=网关本身（系统 dnsmasq 转发）；多个用逗号分隔
DNS=""

# 热点被系统开关/快捷开关打开且网关不是 GATEWAY 时，自动重启一次热点以套用固定网关
# 默认关闭，避免重启造成的接口重建竞态；需要固定网关时再开启。
ENFORCE_GATEWAY="0"
# 开机后自动开启热点
AUTO_START="0"
# 热点接口名，留空=自动识别 (dumpsys tethering)
AP_IFACE=""
# 守护进程轮询间隔（秒，另有 ip monitor 事件即时触发）
POLL_INTERVAL="3"
# 下发 Android 计量网络标记 (DHCP option 43 ANDROID_METERED)，与系统行为一致
METERED="1"
# TetheringService 调用时使用的 callerPkg（uid 0 时系统按 "root" 处理）
CALLER_PKG="root"
# 仅在 hsctl 失败、回退到 `cmd wifi start-softap` 且读不到系统热点配置时使用
FALLBACK_SSID=""
FALLBACK_PASS=""
